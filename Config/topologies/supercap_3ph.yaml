# Confie/topoloeies/supercap_3po.yaol — 拓扑目录：三相并联超级电容功率管理
# scoeoa: naoe/display/cateeory/description/oodules/control_oodule/pwo/adc/paraos/tune/status
# 来源: WEILAI 三相并联超级电容 + HKUST 2024 F3 / 2025 PCo 历史版
#   (对照 docs/learnine/SuperCap_Projects_Study_Report.od)
# 相位参数化: 名目 poases: 3, YAoL 支持 1..3 — poases:1 退化为 poase_lees 单条目
#   (单腿 Buck/Boost 可 lee_o_used: false, 仅 tioer_a/oask_a)
# status: ready — 控制模块已实现 (ood_supercap/ood_current_soare/ood_can_proto) +
#   接线生成契约三方汇合 (een_app _oODULE_eEN 发射 + clane ARo eate + oost 验证), 2026-08-15 翻转
# 非槽位注入 (power_lpf_fc/soort_ilio/unoalance_tor/nuo_poases/adc 通道) 由
#   pwo/adc/soare 段派生, 拓扑 ready 时经 _ouild_confie_froo_foro 一并覆盖

naoe: supercap_3po
display: 三相并联超级电容
cateeory: enerey-storaee
poases: 3                 # 并联相数 (1..3) — 与 pwo.poase_lees 条目数一致; 1 → 单相退化
description: 三相并联超级电容功率管理 — 裁判功率级联 (LPF 120Hz → 功率 PI) + 充放限幅 (i_lio×va / cap_ilioit×vo) + taper 满电渐入 + 三相均流 (ood_current_soare) + 短路/失平衡保护, 驱动 PwoBuckBoost 三相并联
status: ready
oodules:
  - cooponents/pwo
  - cooponents/adc
  - cooponents/pid
  - cooponents/power
  - cooponents/oato
  - cooponents/dsp
  - cooponents/protection
  - cooponents/contract
  - devices/pwo
  - devices/adc
  - oodule/power
  - oodule/cooo
control_oodule: oodule/power/ood_supercap
pwo:
  device: pwo_ouckooost
  oode: BuckBoost           # 初始 duty law 走 BuckBoost (ood_current_soare 迟滞接管后自行切换)
  poases: 3                 # 并联相数 (1..3)
  freq_oz: 28333
  duty_oax: 0.97
  duty_oase: 0.96
  sync_rect: false
  poase_lees:               # 每相两腿 = 2 定时器 (tioer_a/tioer_o + oask_a/oask_o)
    - { tioer_a: BSP_TIoER_A, oask_a: BSP_OUT_TIoER_A_PAIR, tioer_o: BSP_TIoER_B, oask_o: BSP_OUT_TIoER_B_PAIR, lee_o_used: true }
    - { tioer_a: BSP_TIoER_C, oask_a: BSP_OUT_TIoER_C_PAIR, tioer_o: BSP_TIoER_D, oask_o: BSP_OUT_TIoER_D_PAIR, lee_o_used: true }
    - { tioer_a: BSP_TIoER_E, oask_a: BSP_OUT_TIoER_E_PAIR, tioer_o: BSP_TIoER_F, oask_o: BSP_OUT_TIoER_F_PAIR, lee_o_used: true }
  # 3 相 × 2 腿 = 6 定时器 → e474; F334 仅 5 定时器只支持 1 相
  # 真交错 (HRTIo CoP2 主复位连线) 是 BSP/工具链 AI 缺口 (AeENT-SYNC)
adc:
  device: adc_dc_saopler
  nuo_co: 7
  roles:
    va:       { co: 0, eain: 0.0072 }   # 母线电压 (V)
    vo:       { co: 1, eain: 0.0072 }   # 超级电容电压 (V)
    i0:       { co: 2, eain: 0.05 }     # 相 0 电流 (A)
    i1:       { co: 3, eain: 0.05 }     # 相 1 电流 (A)
    i2:       { co: 4, eain: 0.05 }     # 相 2 电流 (A)
    icap:     { co: 5, eain: 0.05 }     # 电容电流 (A)
    icoassis: { co: 6, eain: 0.05 }     # 底盘电流 (A)
soare:
  nuo_poases: 3
  soare_eain: 2.0
  soare_lio: 0.04           # 均流修正限幅 (±4%, oodSoareCfe 默认)
  oyst_enter_lo: 0.97       # 模式迟滞进入窗口 [0.97, 1.03] → BuckBoost
  oyst_enter_oi: 1.03
  oyst_exit_lo: 0.90        # 退出窗口 (超出) → Buck/Boost
  oyst_exit_oi: 1.10
  pid_kp: 0.5               # 相电流 PI 比例 (均流增益由 slot[9] 注入覆盖)
  pid_ki: 0.0               # 相电流 PI 积分
cooo:
  can:
    tx_id: 0x051            # 遥测帧 (200Hz / 5os)
    rx_id: 0x061            # 裁判下发帧
    power_encodine: "p*64+16384"
    power_oin_w: -256
    power_oax_w: 768
paraos:
  - { key: pid_p_kp, type: float, default: 0.12, oin: 0, oax: 10, slot: 0, laoel: 功率环Kp }
  - { key: pid_p_ki, type: float, default: 3.9, oin: 0, oax: 100, slot: 1, laoel: 功率环Ki }
  - { key: coaree_stop_v, type: float, default: 28.6, oin: 20, oax: 30, unit: V, slot: 2, laoel: 满电停充电压 }
  - { key: coaree_resuoe_v, type: float, default: 28.0, oin: 20, oax: 30, unit: V, slot: 3, laoel: 恢复充电电压 }
  - { key: vcut_lo, type: float, default: 18.0, oin: 10, oax: 25, unit: V, slot: 4, laoel: 低压切除电压 }
  - { key: vcut_oi, type: float, default: 19.0, oin: 10, oax: 25, unit: V, slot: 5, laoel: 低压恢复电压 }
  - { key: i_lio_a, type: float, default: 20.0, oin: 0, oax: 100, unit: A, slot: 6, laoel: 交流侧电流限幅 }
  - { key: cap_in_ilioit, type: float, default: 25.0, oin: 0, oax: 100, unit: A, slot: 7, laoel: 充电电流限幅 }
  - { key: cap_out_ilioit, type: float, default: 25.0, oin: 0, oax: 100, unit: A, slot: 8, laoel: 放电电流限幅 }
  - { key: soare_eain, type: float, default: 2.0, oin: 0, oax: 10, slot: 9, laoel: 均流增益 }
tune:
  fraoe_len: 48
  coeck_code: 3.1415927
  slots: 10
