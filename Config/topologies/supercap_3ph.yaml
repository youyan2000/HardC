# Config/topologies/supercap_3ph.yaml — 拓扑目录：三相并联超级电容功率管理
# schema: name/display/category/description/modules/control_module/pwm/adc/params/tune/status
# 来源: WEILAI 三相并联超级电容 + HKUST 2024 F3 / 2025 PCM 历史版
#   (对照 docs/learning/SuperCap_Projects_Study_Report.md)
# 相位参数化: 名目 phases: 3, YAML 支持 1..3 — phases:1 退化为 phase_legs 单条目
#   (单腿 Buck/Boost 可 leg_b_used: false, 仅 timer_a/mask_a)
# status: ready — 控制模块已实现 (mod_supercap/mod_current_share/mod_can_proto) +
#   接线生成契约三方汇合 (gen_app _MODULE_GEN 发射 + clang ARM gate + host 验证), 2026-08-15 翻转
# 非槽位注入 (power_lpf_fc/short_ilim/unbalance_thr/num_phases/adc 通道) 由
#   pwm/adc/share 段派生, 拓扑 ready 时经 _build_config_from_form 一并覆盖

name: supercap_3ph
display: 三相并联超级电容
category: energy-storage
phases: 3                 # 并联相数 (1..3) — 与 pwm.phase_legs 条目数一致; 1 → 单相退化
description: 三相并联超级电容功率管理 — 裁判功率级联 (LPF 120Hz → 功率 PI) + 充放限幅 (i_lim×va / cap_ilimit×vb) + taper 满电渐入 + 三相均流 (mod_current_share) + 短路/失平衡保护, 驱动 PwmBuckBoost 三相并联
status: ready
modules:
  - components/pwm
  - components/adc
  - components/pid
  - components/power
  - components/math
  - components/dsp
  - components/protection
  - components/contract
  - devices/pwm
  - devices/adc
  - module/power
  - module/comm
control_module: module/power/mod_supercap
pwm:
  device: pwm_buckboost
  mode: BuckBoost           # 初始 duty law 走 BuckBoost (mod_current_share 迟滞接管后自行切换)
  phases: 3                 # 并联相数 (1..3)
  freq_hz: 28333
  duty_max: 0.97
  duty_base: 0.96
  sync_rect: false
  phase_legs:               # 每相两腿 = 2 定时器 (timer_a/timer_b + mask_a/mask_b)
    - { timer_a: BSP_TIMER_A, mask_a: BSP_OUT_TIMER_A_PAIR, timer_b: BSP_TIMER_B, mask_b: BSP_OUT_TIMER_B_PAIR, leg_b_used: true }
    - { timer_a: BSP_TIMER_C, mask_a: BSP_OUT_TIMER_C_PAIR, timer_b: BSP_TIMER_D, mask_b: BSP_OUT_TIMER_D_PAIR, leg_b_used: true }
    - { timer_a: BSP_TIMER_E, mask_a: BSP_OUT_TIMER_E_PAIR, timer_b: BSP_TIMER_F, mask_b: BSP_OUT_TIMER_F_PAIR, leg_b_used: true }
  # 3 相 × 2 腿 = 6 定时器 → G474; F334 仅 5 定时器只支持 1 相
  # 真交错 (HRTIM CMP2 主复位连线) 是 BSP/工具链 AI 缺口 (AGENT-SYNC)
adc:
  device: adc_dc_sampler
  num_ch: 7
  roles:
    va:       { ch: 0, gain: 0.0072 }   # 母线电压 (V)
    vb:       { ch: 1, gain: 0.0072 }   # 超级电容电压 (V)
    i0:       { ch: 2, gain: 0.05 }     # 相 0 电流 (A)
    i1:       { ch: 3, gain: 0.05 }     # 相 1 电流 (A)
    i2:       { ch: 4, gain: 0.05 }     # 相 2 电流 (A)
    icap:     { ch: 5, gain: 0.05 }     # 电容电流 (A)
    ichassis: { ch: 6, gain: 0.05 }     # 底盘电流 (A)
share:
  num_phases: 3
  share_gain: 2.0
  share_lim: 0.04           # 均流修正限幅 (±4%, ModShareCfg 默认)
  hyst_enter_lo: 0.97       # 模式迟滞进入窗口 [0.97, 1.03] → BuckBoost
  hyst_enter_hi: 1.03
  hyst_exit_lo: 0.90        # 退出窗口 (超出) → Buck/Boost
  hyst_exit_hi: 1.10
  pid_kp: 0.5               # 相电流 PI 比例 (均流增益由 slot[9] 注入覆盖)
  pid_ki: 0.0               # 相电流 PI 积分
comm:
  can:
    tx_id: 0x051            # 遥测帧 (200Hz / 5ms)
    rx_id: 0x061            # 裁判下发帧
    power_encoding: "p*64+16384"
    power_min_w: -256
    power_max_w: 768
params:
  - { key: pid_p_kp, type: float, default: 0.12, min: 0, max: 10, slot: 0, label: 功率环Kp }
  - { key: pid_p_ki, type: float, default: 3.9, min: 0, max: 100, slot: 1, label: 功率环Ki }
  - { key: charge_stop_v, type: float, default: 28.6, min: 20, max: 30, unit: V, slot: 2, label: 满电停充电压 }
  - { key: charge_resume_v, type: float, default: 28.0, min: 20, max: 30, unit: V, slot: 3, label: 恢复充电电压 }
  - { key: vcut_lo, type: float, default: 18.0, min: 10, max: 25, unit: V, slot: 4, label: 低压切除电压 }
  - { key: vcut_hi, type: float, default: 19.0, min: 10, max: 25, unit: V, slot: 5, label: 低压恢复电压 }
  - { key: i_lim_a, type: float, default: 20.0, min: 0, max: 100, unit: A, slot: 6, label: 交流侧电流限幅 }
  - { key: cap_in_ilimit, type: float, default: 25.0, min: 0, max: 100, unit: A, slot: 7, label: 充电电流限幅 }
  - { key: cap_out_ilimit, type: float, default: 25.0, min: 0, max: 100, unit: A, slot: 8, label: 放电电流限幅 }
  - { key: share_gain, type: float, default: 2.0, min: 0, max: 10, slot: 9, label: 均流增益 }
tune:
  frame_len: 48
  check_code: 3.1415927
  slots: 10
