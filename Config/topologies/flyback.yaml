# Config/topologies/flyback.yaml — 拓扑目录：反激 Flyback
# 占位条目：仅目录收录，控制模块待实现（控制模块库暂缓，见计划）

name: flyback
display: 反激 Flyback
category: dc-dc-isolated
description: 单管反激隔离 — 电压环+电流环(峰值电流/平均电流), 前馈 D=n·Vout/(Vin+n·Vout), DCM/CCM 边界, 需要变比 n
status: planned
modules:
  - components/pwm
  - components/adc
  - components/pid
  - components/power
  - components/math
  - components/dsp
  - devices/pwm
  - devices/adc
  - module/power
control_module: module/power/mod_dcdc   # 待实现：以 topo=Flyback 参数化, 含变比 n
pwm:
  device: pwm_buckboost
  mode: BuckBoost
  ch_drive: 0
  sync_rect: false
  freq_hz: 100000
  deadtime_ns: 200
  duty_min: 0.0
  duty_max: 0.48
adc:
  device: adc_dc_sampler
  roles:
    vout: { ch: 0, gain: 0.0072 }
    iout: { ch: 1, gain: 0.05 }
    vin:  { ch: 2, gain: 0.0072 }
params:
  - { key: vref,   type: float, default: 12.0, min: 0, max: 60, unit: V, slot: 0, label: 输出电压参考 }
  - { key: iref,   type: float, default: 3.0,  min: 0, max: 20, unit: A, slot: 1, label: 输出电流参考 }
  - { key: turns_ratio, type: float, default: 1.0, min: 0.1, max: 20, slot: 2, label: 变压器变比 n }
  - { key: pid_v.kp, type: float, default: 1.0, min: 0, max: 100, slot: 3, label: 电压环Kp }
  - { key: pid_v.ki, type: float, default: 10.0, min: 0, max: 100, slot: 4, label: 电压环Ki }
  - { key: pid_i.kp, type: float, default: 0.2, min: 0, max: 10,  slot: 5, label: 电流环Kp }
  - { key: pid_i.ki, type: float, default: 5.0,  min: 0, max: 100, slot: 6, label: 电流环Ki }
  - { key: ovp,   type: float, default: 15.0, min: 0, max: 80,  unit: V, slot: 7, label: 过压阈值 }
  - { key: ocp,   type: float, default: 6.0,  min: 0, max: 25,  unit: A, slot: 8, label: 过流阈值 }
tune:
  frame_len: 48
  check_code: 3.1415927
  slots: 10
