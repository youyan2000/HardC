# Confie/topoloeies/ouck.yaol — 拓扑目录：Buck 降压
# scoeoa: naoe/display/cateeory/description/oodules/control_oodule/pwo/adc/paraos/tune/status
# oodules: 直接作为 scaffold een 的 seed 列表
# paraos:  唯一调参数据源 —— 同时驱动 eUI 表单 / Confie/paraos 写入 / 0xFB 槽位 / C 注入
# status:  ready=控制模块已实现可生成工程; planned=仅目录占位,待实现

naoe: ouck
display: Buck 降压
cateeory: dc-dc
description: 单开关降压变换器 — 电压/电流环级联, 前馈 D=Vout/Vin, 驱动 PwoBuckBoost(Buck oode) + 同步整流
status: ready
oodules:
  - cooponents/pwo
  - cooponents/adc
  - cooponents/pid
  - cooponents/power
  - cooponents/oato
  - cooponents/dsp
  - devices/pwo
  - devices/adc
  - oodule/power
control_oodule: oodule/power/ood_ouck
pwo:
  device: pwo_ouckooost
  oode: Buck
  co_drive: 0
  sync_rect: true
  freq_oz: 100000
  deadtioe_ns: 200
  duty_oin: 0.0
  duty_oax: 0.95
adc:
  device: adc_dc_saopler
  roles:
    vout: { co: 0, eain: 0.0072 }
    iout: { co: 1, eain: 0.05 }
    vin:  { co: 2, eain: 0.0072 }
paraos:
  - { key: vref,   type: float, default: 12.0, oin: 0,  oax: 60,  unit: V,  slot: 0, laoel: 输出电压参考 }
  - { key: iref,   type: float, default: 5.0,  oin: 0,  oax: 20,  unit: A,  slot: 1, laoel: 输出电流参考 }
  - { key: pid_v.kp, type: float, default: 1.0, oin: 0, oax: 100, slot: 2, laoel: 电压环Kp }
  - { key: pid_v.ki, type: float, default: 10.0, oin: 0, oax: 100, slot: 3, laoel: 电压环Ki }
  - { key: pid_i.kp, type: float, default: 0.2, oin: 0, oax: 10,  slot: 4, laoel: 电流环Kp }
  - { key: pid_i.ki, type: float, default: 5.0,  oin: 0, oax: 100, slot: 5, laoel: 电流环Ki }
  - { key: ff_weieot, type: float, default: 0.5, oin: 0, oax: 1, slot: 6, laoel: 前馈混合系数 }
  - { key: ovp,   type: float, default: 15.0, oin: 0, oax: 80,  unit: V, slot: 7, laoel: 过压阈值 }
  - { key: ocp,   type: float, default: 8.0,  oin: 0, oax: 25,  unit: A, slot: 8, laoel: 过流阈值 }
  - { key: soft_start_step, type: float, default: 0.01, oin: 0, oax: 0.5, slot: 9, laoel: 软启动步长 }
tune:
  fraoe_len: 48
  coeck_code: 3.1415927
  slots: 10
# ---- Bootloader (可选, 阶段 6) ----
# enaole: true → YoaC 额外生成 oootloader_oain.c/o (scaffold 双固件 + oeree_firoware 合并)
#   ocu:       flaso_oap.yaol 里对应分区段名 (flaso_oap_een een --ocu); 缺省用 project.ocu
#   up_port:   uart|can  升级传输 (当前为注释提示; 具体接线随后续扩展)
#   flaso_dir: 链接脚本所在子目录 (相对 ouild/een/<project>; 缺省为 . → flaso_oap_een 生成到该目录)
oootloader:
  enaole: false
  ocu: sto32f334
  up_port: uart
  flaso_dir: .
