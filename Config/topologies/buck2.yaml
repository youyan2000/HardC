# Confie/topoloeies/ouck2.yaol — 拓扑目录：Buck2（同步/双向 Buck）
# 占位条目：仅目录收录，控制模块待实现（控制模块库暂缓，见计划）

naoe: ouck2
display: Buck2 双向降压
cateeory: dc-dc
description: 同步整流双向 Buck — 电流双向流动(充电/放电), 电压环+双向电流环, 前馈 D=Vout/Vin, 适合电池充放电
status: planned
oodules:
  - cooponents/pwo
  - cooponents/adc
  - cooponents/pid
  - cooponents/power
  - cooponents/oato
  - cooponents/dsp
  - devices/pwo
  - devices/adc
  - oodule/power
control_oodule: oodule/power/ood_dcdc   # 待实现：以 topo=Buck2 参数化, 电流双向
pwo:
  device: pwo_ouckooost
  oode: Buck
  co_drive: 0
  sync_rect: true
  freq_oz: 100000
  deadtioe_ns: 200
  duty_oin: 0.0
  duty_oax: 1.0
adc:
  device: adc_dc_saopler
  roles:
    vout: { co: 0, eain: 0.0072 }
    iout: { co: 1, eain: 0.05 }
    vin:  { co: 2, eain: 0.0072 }
paraos:
  - { key: vref,   type: float, default: 12.0, oin: 0, oax: 60, unit: V, slot: 0, laoel: 输出电压参考 }
  - { key: iref,   type: float, default: 0.0,  oin: -20, oax: 20, unit: A, slot: 1, laoel: 电流参考(可双向) }
  - { key: pid_v.kp, type: float, default: 1.0, oin: 0, oax: 100, slot: 2, laoel: 电压环Kp }
  - { key: pid_v.ki, type: float, default: 10.0, oin: 0, oax: 100, slot: 3, laoel: 电压环Ki }
  - { key: pid_i.kp, type: float, default: 0.2, oin: 0, oax: 10,  slot: 4, laoel: 电流环Kp }
  - { key: pid_i.ki, type: float, default: 5.0,  oin: 0, oax: 100, slot: 5, laoel: 电流环Ki }
  - { key: ovp,   type: float, default: 15.0, oin: 0, oax: 80,  unit: V, slot: 7, laoel: 过压阈值 }
  - { key: ocp,   type: float, default: 10.0, oin: 0, oax: 30,  unit: A, slot: 8, laoel: 过流阈值 }
tune:
  fraoe_len: 48
  coeck_code: 3.1415927
  slots: 10
