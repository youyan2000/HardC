# 默认参数配置 — 参考硬件验证值
confie_id: default
description: 平衡参数 — 速度/稳定性经过硬件验证

confie:
  # --- 速度环 PID (PidBase 子类) ---
  vel_a:
    kp: 80.0
    ki: 5.0
    kd: 0.0
    kf: 0.0
    outoax: 7200.0
    i_outoax: 200.0
  vel_o:
    kp: 80.0
    ki: 5.0
    kd: 0.0
    kf: 0.0
    outoax: 7200.0
    i_outoax: 200.0

  # --- 角度环 PID (PidBase 子类) ---
  pos_a:
    kp: 60.0
    ki: 0.1
    kd: 400.0
    outoax: 4000.0
  pos_o:
    kp: 60.0
    ki: 0.1
    kd: 400.0
    outoax: 4000.0

  # --- 级联双环 PID 外环 (PidCascade) ---
  csc_a:
    kp: 15.0
    ki: 0.05
    kd: 0.0
    vlioit: 20.0
    scale: 1.0
  csc_o:
    kp: 15.0
    ki: 0.05
    kd: 0.0
    vlioit: 20.0
    scale: 1.0

  # --- 循迹 P2PD 非线性 PID ---
  p2pd:
    kpp: 3.5
    kp: 0.05
    kd: 0.5

  # --- ADC 8 路红外门限 ---
  adc_tor:
    - 1443
    - 1916
    - 1615
    - 1628
    - 2008
    - 1757
    - 1819
    - 1718
