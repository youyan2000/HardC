  - bsp_gpio_stm32.c     # STM32 GPIO 后端 (bsp_gpio.h, GPIO 电平 + EXTI 分发)
  - bsp_watchdog.h       # 看门狗 BSP 抽象 (LibXR Watchdog/STM32Watchdog 移植)
  - bsp_watchdog_stm32.c # STM32 HAL IWDG 后端 (LibXR stm32_watchdog.cpp 移植)
  - bsp_watchdog_c2000.c # C2000 WDT 后端 (Phase 3 按数据手册核对)
  - container_of.h
depends: []
